[main]
dpi-aware = no
font = Abstruct:pixelsize=12, Cozette:pixelsize=13, Noto Color Emoji
pad = 0x0
resize-by-cells = yes

[colors-dark]
background= 000000
foreground= ffffff

## Normal/regular colors (color palette 0-7)
regular0=444444  # black
regular1=CC7777  # red
regular2=77BBAA  # green
regular3=DDBB88  # yellow
regular4=7788CC  # blue
regular5=7766BB  # magenta
regular6=77AACC  # cyan
regular7=AAAAAA  # white

## Bright colors (color palette 8-15)
bright0=777788   # bright black
bright1=FFBBCC   # bright red
bright2=99FFBB   # bright green
bright3=FFDD99   # bright yellow
bright4=BBDDFF   # bright blue
bright5=CCAAFF   # bright magenta
bright6=CCFFFF   # bright cyan
bright7=DDDDDD   # bright white
